# This is the actual "extension to a proxy" wiring: the Gateway (Envoy)
# owns routing, TLS termination, and the cluster's single ingress point;
# Aquifer owns the queue behind it. Not a sidecar -- Aquifer is a normal
# ClusterIP-backed Deployment that the Gateway happens to route to.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aquifer
  namespace: aquifer
spec:
  parentRefs:
    - name: aquifer-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aquifer
          port: 8080

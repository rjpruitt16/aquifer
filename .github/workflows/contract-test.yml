name: Contract tests (Aqueduct Runner)

# Cross-repo contract tests against the real, unmodified aquifer image --
# proves at the wire level that the shared X-Aqueduct-*/X-EZTHROTTLE-*
# contract with Spillway still holds, not just that aquifer's own
# unit/integration tests pass. See github.com/rjpruitt16/aqueduct-runner.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aquifer
        uses: actions/checkout@v4
        with:
          path: aquifer

      - name: Pick the aqueduct-runner branch
        id: runner
        env:
          BRANCH: ${{ github.head_ref }}
        # A runner branch with the same name as this PR's branch carries the
        # matching contract change; test against it. Otherwise use main.
        run: |
          ref=main
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads https://github.com/rjpruitt16/aqueduct-runner "$BRANCH" >/dev/null; then
            ref="$BRANCH"
          fi
          echo "Testing with aqueduct-runner@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout aqueduct-runner
        uses: actions/checkout@v4
        with:
          repository: rjpruitt16/aqueduct-runner
          ref: ${{ steps.runner.outputs.ref }}
          path: aqueduct-runner

      - name: Contract test -- shared suite (health, lifecycle, idempotency, proxy, L8)
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-aquifer
            --source=./aquifer
            --hurl-dir=./aqueduct-runner/hurl
            --recorder-dir=./aqueduct-runner/recorder

      - name: Contract test -- admission rejection
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-aquifer-admission
            --source=./aquifer
            --hurl-dir=./aqueduct-runner/hurl
            --recorder-dir=./aqueduct-runner/recorder

      - name: Contract test -- L8 request schemas (422 on mismatch)
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-aquifer-request-schemas
            --source=./aquifer
            --hurl-dir=./aqueduct-runner/hurl
            --recorder-dir=./aqueduct-runner/recorder

      - name: Contract test -- WebSocket durability, replay, reconnect, and local limits
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-aquifer-websocket
            --source=./aquifer
            --websocket-dir=./aqueduct-runner/websocket

      - name: Contract test -- SIGTERM drain and WebSocket handoff
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-aquifer-shutdown
            --source=./aquifer
            --websocket-dir=./aqueduct-runner/websocket

  # Separate job so a slow drain-mode regression doesn't hold up the fast
  # checks above -- both start immediately, no `needs:` dependency.
  contract-test-drain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aquifer
        uses: actions/checkout@v4
        with:
          path: aquifer

      - name: Pick the aqueduct-runner branch
        id: runner
        env:
          BRANCH: ${{ github.head_ref }}
        # A runner branch with the same name as this PR's branch carries the
        # matching contract change; test against it. Otherwise use main.
        run: |
          ref=main
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads https://github.com/rjpruitt16/aqueduct-runner "$BRANCH" >/dev/null; then
            ref="$BRANCH"
          fi
          echo "Testing with aqueduct-runner@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout aqueduct-runner
        uses: actions/checkout@v4
        with:
          repository: rjpruitt16/aqueduct-runner
          ref: ${{ steps.runner.outputs.ref }}
          path: aqueduct-runner

      # Genuinely takes ~5+ minutes -- gated by a hardcoded 5-minute idle
      # constant in account_queue.go, not by AQUIFER_DRAIN_TIMER_SECONDS.
      # See aqueduct-runner's README "Known caveat" section.
      - name: Contract test -- drain-mode ledger (~5 min)
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-aquifer-drain
            --source=./aquifer
            --hurl-dir=./aqueduct-runner/hurl
            --recorder-dir=./aqueduct-runner/recorder

  # Separate job, same reasoning as contract-test-drain above: this one
  # depends on a third repo (canalis-rs) and its own container build, no
  # reason to hold up the faster checks on it.
  contract-test-registration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aquifer
        uses: actions/checkout@v4
        with:
          path: aquifer

      - name: Checkout canalis-rs
        uses: actions/checkout@v4
        with:
          repository: rjpruitt16/canalis-rs
          path: canalis-rs

      - name: Pick the aqueduct-runner branch
        id: runner
        env:
          BRANCH: ${{ github.head_ref }}
        # A runner branch with the same name as this PR's branch carries the
        # matching contract change; test against it. Otherwise use main.
        run: |
          ref=main
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads https://github.com/rjpruitt16/aqueduct-runner "$BRANCH" >/dev/null; then
            ref="$BRANCH"
          fi
          echo "Testing with aqueduct-runner@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout aqueduct-runner
        uses: actions/checkout@v4
        with:
          repository: rjpruitt16/aqueduct-runner
          ref: ${{ steps.runner.outputs.ref }}
          path: aqueduct-runner

      - name: Contract test -- real Aquifer -> Canalis -> Valkey registration ping
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-registration
            --aquifer-source=./aquifer
            --canalis-source=./canalis-rs

      - name: Contract test -- Aquifer and Canalis claim users with the same Lua
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.8"
          module: ./aqueduct-runner
          call: >-
            test-claim-script
            --aquifer-source=./aquifer
            --canalis-source=./canalis-rs

# Driver for the 3-hour storm test: 15 minutes at 500 jobs/s, two hours at
# 1,500 (twice the soak's sustained ceiling of about 750), then 45 minutes
# at 300 to watch the backlog drain. Jobs go to 200 customer endpoints on
# ports 9000-9199 (140 healthy, 30 slow, 20 flaky, 10 dead), with 0-4KB
# bodies. One kill -9 lands 75 minutes in, an hour into the storm. No
# WebSocket, daily ramp, combined peak or reboot. Status pages on 8081.
app = "aquifer-storm-driver"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.driver"

[env]
  SOAK_NAME = "Aquifer storm"
  SOAK_TARGET = "http://aquifer-storm.internal:8080"
  SOAK_SUPERVISOR = "http://aquifer-storm.internal:9090"
  SOAK_SELF = "http://aquifer-storm-driver.internal:8080"
  SOAK_DATA = "/data/storm-3"
  SOAK_WS = "false"

# Arguments to the image's /driver entrypoint.
[processes]
  app = "-phases=15m@500,2h@1500,45m@300 -receivers=200 -body-kb=4 -ramp-hour=-1 -peak-hour=-1 -reboot-every=0 -kill-min=75m -kill-max=75m"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "storm_driver_data"
  destination = "/data"
  initial_size = "3gb"

[[restart]]
  policy = "always"

[[vm]]
  size = "performance-2x"
  memory = "4gb"

# Spillway for the soak test, under the same supervisor as Aquifer. No public
# service: the driver reaches Spillway (4000) and the supervisor (9090) over
# Fly's private network. Needs a SECRET_KEY_BASE secret.
app = "spillway-soak"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.spillway-target"

[env]
  SOAK_DATA_DIR = "/data/run-3"
  # Run 2's store grew past what 2GB of RAM could reload on boot (Mnesia
  # disc_copies tables live entirely in RAM) and Spillway crash-looped, so
  # it runs on 4GB from run 3, twice Aquifer's memory.
  MNESIA_DIR = "/data/run-3/mnesia"
  SPILLWAY_DEFAULT_RPS = "5000"
  # Admission compares the VM's own memory count with this limit, and the
  # process's resident size runs up to ~1.4x that count. 1400 let RSS reach
  # the 2GB machine's limit, so the kernel killed Spillway before admission
  # ever refused a job (21 OOM kills in run 2's first hour). On 4GB, 2600
  # leaves room for that ratio.
  SPILLWAY_MEMORY_LIMIT_MB = "2600"
  SPILLWAY_DB_MAX_BYTES = "6000000000"
  SPILLWAY_WS_STREAM_MAX_EVENTS = "500"
  SPILLWAY_WS_STREAM_TTL_SECONDS = "3600"
  SPILLWAY_WS_MAX_CLIENT_CONNECTIONS = "3000"
  SPILLWAY_WS_MAX_UPSTREAM_CONNECTIONS = "3000"
  SPILLWAY_WS_MAX_WAITING_CONNECTIONS = "3000"
  SPILLWAY_WS_CONNECT_RPS = "200"
  SPILLWAY_WS_SLOW_START_RPS = "20"

[[mounts]]
  source = "spillway_soak_data"
  destination = "/data"
  initial_size = "10gb"

[[restart]]
  policy = "always"

[[vm]]
  size = "performance-1x"
  memory = "4gb"

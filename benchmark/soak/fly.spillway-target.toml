# Spillway for the soak test, under the same supervisor as Aquifer. No public
# service: the driver reaches Spillway (4000) and the supervisor (9090) over
# Fly's private network. Needs a SECRET_KEY_BASE secret.
app = "spillway-soak"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.spillway-target"

[env]
  SOAK_DATA_DIR = "/data/run-3k"
  # Jobs, results, idempotency keys and WebSocket fallback transcripts in
  # Spillway's own RocksDB store (no Mnesia since spillway#53). Run 3k is
  # the week-long run on two CPUs, which run 3j showed Spillway needs: on
  # one CPU, cleanup fell behind. 3k adds spillway#65 (memory ceiling
  # default, sync-lag admission) and #68 (webhooks retry until delivered,
  # instead of giving up after about 15 seconds of a receiver outage).
  SPILLWAY_STORE_DIR = "/data/run-3k/store"
  # WebSocket transcripts in a local Valkey, as on the Aquifer target.
  SOAK_VALKEY = "1"
  SOAK_VALKEY_MAXMEMORY = "600mb"
  SPILLWAY_VALKEY_URL = "redis://127.0.0.1:6379"
  SPILLWAY_DEFAULT_RPS = "5000"
  # Admission compares this with resident memory. Leaves room for Valkey's
  # 600MB ceiling on the 2GB machine.
  SPILLWAY_MEMORY_LIMIT_MB = "1200"
  # The volume has about 7.9GB free (run 3j's directory remains);
  # refuse new jobs well before it fills.
  SPILLWAY_DB_MAX_BYTES = "3500000000"
  SPILLWAY_WS_STREAM_MAX_EVENTS = "500"
  SPILLWAY_WS_STREAM_TTL_SECONDS = "3600"
  SPILLWAY_WS_MAX_CLIENT_CONNECTIONS = "3000"
  SPILLWAY_WS_MAX_UPSTREAM_CONNECTIONS = "3000"
  SPILLWAY_WS_MAX_WAITING_CONNECTIONS = "3000"
  SPILLWAY_WS_CONNECT_RPS = "200"
  SPILLWAY_WS_SLOW_START_RPS = "20"

[[mounts]]
  source = "spillway_soak_data"
  destination = "/data"
  initial_size = "10gb"

[[restart]]
  policy = "always"

# Two dedicated CPUs (Fly's smallest performance-2x has 4GB; admission still
# stops at 1,200MB). Aquifer's soak target stays on performance-1x.
[[vm]]
  size = "performance-2x"
  memory = "4gb"
